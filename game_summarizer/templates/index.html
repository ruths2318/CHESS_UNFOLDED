<!DOCTYPE html>
<html>
<head>
    <title>Game Summarizer</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 40px;
            background-color: #f2f2f2;
        }

        h1 {
            text-align: center;
            color: #333;
        }

        section {
            background-color: #fff;
            padding: 30px;
            border-radius: 12px;
            max-width: 700px;
            margin: 30px auto;
            box-shadow: 0 0 15px rgba(0,0,0,0.1);
        }

        label {
            font-weight: bold;
            display: block;
            margin-top: 15px;
        }

        textarea, select, input[type="file"] {
            width: 100%;
            margin-top: 5px;
            padding: 10px;
            border-radius: 6px;
            border: 1px solid #ccc;
            resize: vertical;
            margin-bottom: 20px;
        }

        button {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
            margin-right: 10px;
            margin-top: 10px;
        }

        button:hover {
            background-color: #0056b3;
        }

        #loadingSpinner {
            display: none;
            margin: 20px auto;
            border: 6px solid #f3f3f3;
            border-top: 6px solid #007bff;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        #summaryOutput {
            background-color: #fff;
            max-width: 700px;
            margin: 30px auto 0;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 0 15px rgba(0,0,0,0.1);
            white-space: pre-wrap;
        }
    </style>
</head>
<body>

<h1>Game Summarizer</h1>

<!-- 1️⃣ Upload New PGN Section -->
<section>
    <h2>Upload and Summarize a New Game</h2>
    <form id="pgnForm" onsubmit="handleSubmit(event)">
        {% csrf_token %}
        <label for="pgn_text">Paste PGN Text:</label>
        <textarea name="pgn_text" id="pgn_text" placeholder="Paste your PGN here..."></textarea>

        <label for="pgn_file">Or Upload PGN File:</label>
        <input type="file" name="pgn_file" id="pgn_file" accept=".pgn"/>

        <div>
            <button type="submit">Summarize New Game</button>
            <button type="button" onclick="handleRefresh()">Clear</button>
        </div>
    </form>
</section>

<hr>

<!-- 2️⃣ Analyze Existing Games Section -->
<section>
    <h2>Analyze an Existing Game</h2>

    {% if games %}
    <label for="existingGame">Select a Past Game:</label>
    <select id="existingGame">
        <option value="">-- Select a Game --</option>
        {% for game in games %}
            <option value="{{ game.id }}">
                {{ game.date }} | {{ game.player_1 }} vs {{ game.player_2 }} ({{ game.result }})
            </option>
        {% endfor %}
    </select>
    <button onclick="analyzeSelectedGame()">Analyze Selected Game</button>
    {% else %}
    <p>No past games found.</p>
    {% endif %}
</section>

<div id="loadingSpinner"></div>

<div id="summaryOutput"></div>

<!-- JavaScript -->
<script>
async function handleSubmit(event) {
    event.preventDefault();
    const form = document.getElementById('pgnForm');
    const formData = new FormData(form);

    const spinner = document.getElementById('loadingSpinner');
    const outputDiv = document.getElementById('summaryOutput');
    spinner.style.display = 'block';
    outputDiv.innerText = '';

    try {
        const response = await fetch("/game_summarizer/summarize/", {
            method: "POST",
            body: formData
        });
        const data = await response.json();
        if (response.ok) {
            showSummary(data);
        } else {
            outputDiv.innerText = data.error || "Something went wrong.";
        }
    } catch (err) {
        outputDiv.innerText = "Error submitting the form.";
    } finally {
        spinner.style.display = 'none';
    }
}

async function analyzeSelectedGame() {
    const select = document.getElementById('existingGame');
    const gameId = select.value;

    if (!gameId) {
        alert("Please select a game!");
        return;
    }

    const spinner = document.getElementById('loadingSpinner');
    const outputDiv = document.getElementById('summaryOutput');
    spinner.style.display = 'block';
    outputDiv.innerText = '';

    try {
        const response = await fetch(`/game_summarizer/analyze_existing/${gameId}/`);
        const data = await response.json();
        if (response.ok) {
            showSummary(data);
        } else {
            outputDiv.innerText = data.error || "Something went wrong.";
        }
    } catch (err) {
        outputDiv.innerText = "Error fetching existing game.";
    } finally {
        spinner.style.display = 'none';
    }
}

function showSummary(data) {
    const outputDiv = document.getElementById('summaryOutput');
    outputDiv.innerHTML = data.summary;
    if (data.image_url) {
        outputDiv.innerHTML += `
            <h3 style="margin-top: 30px;">⏱ Time Analysis Plot</h3>
            <img src="${data.image_url}" alt="Time Analysis Plot" style="max-width: 100%; margin-top: 10px;" />
        `;
    }
}

function handleRefresh() {
    document.getElementById('pgnForm').reset();
    document.getElementById('summaryOutput').innerText = '';
}
</script>

</body>
</html>
